<div>
  @if (authors().length > 0) {
    <div class="grid grid-cols-4 px-48 py-4 -space-x-px -space-y-px">
      @for (author of authors(); track author.id) {

        <div class="border border-gray-300 p-6">

          <div class="flex justify-center h-72">
            <img
              (error)="imageErrorHandle($event)"
              class="object-contain"
              [alt]="author.name"
              width="200"
              [src]="author.image ? author.image : '/images/bookDefault.png'"
            />
          </div>

          <div class="text-2xl mt-4 font-medium">
            {{ author.name }}
          </div>

          <div class="text-sm text-gray-500 mt-2">
            {{ author.country }}
          </div>

          <div class="text-sm text-gray-600 mt-2">
            {{ author.birth_date }}
          </div>

          <div class="mt-4">
            {{ author.biography }}
          </div>

        </div>

      }
    </div>
  } @else {
    <h2 class="text-2xl text-center">
      Автори завантажуються...
    </h2>
  }
</div>
